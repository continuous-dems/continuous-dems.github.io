name: "Build and deploy to GitHub Pages"

on:
  push:
    branches: ["main"]
  workflow_dispatch:


# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  build:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@ba3bd30d0611be2b591b920bf05b6fa72d3e91d3

      - run: "pixi run render"

      - name: "Upload site artifact"
        uses: actions/upload-pages-artifact@56f665a64387d8df932f913d39589d97a06c59b2
        with:
          path: "./_build/html"


  deploy:
    runs-on: "ubuntu-latest"
    needs: "build"
    environment:
      name: "github-pages"
      url: "${{ steps.deployment.outputs.page_url }}"
    permissions:
      pages: "write"
      id-token: "write"
    steps:
      - name: "Deploy to GitHub Pages"
        id: "deployment"
        uses: actions/deploy-pages@d6287fa90f0d7d9137b60b3ee17ec79e663a7f05
